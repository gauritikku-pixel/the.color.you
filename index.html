<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE COLOR YOU</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--ink:#14193a;--mut:#6c6c82;--bg:#fbf6f3;--glass:rgba(255,255,255,.72);--line:rgba(20,25,58,.14);--a1:#f8d5c2;--a2:#ecc4d6;--a3:#d9d0f0;--btn:#14193a;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f3ecff;--mut:#b6aed2;--bg:#15101f;--glass:rgba(42,31,64,.66);--line:rgba(243,236,255,.16);--a1:#5a3340;--a2:#3d2a5c;--a3:#24305c;--btn:#f3ecff;--btnt:#14193a;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f3ecff;--mut:#b6aed2;--bg:#15101f;--glass:rgba(42,31,64,.66);--line:rgba(243,236,255,.16);--a1:#5a3340;--a2:#3d2a5c;--a3:#24305c;--btn:#f3ecff;--btnt:#14193a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Jost,system-ui,sans-serif;color:var(--ink);background:radial-gradient(60% 50% at 12% 22%,var(--a1),transparent 70%),radial-gradient(50% 60% at 88% 45%,var(--a2),transparent 70%),radial-gradient(60% 50% at 55% 98%,var(--a3),transparent 70%),var(--bg);background-attachment:fixed;overflow:hidden}
#app{height:100%;overflow:auto;padding:0 clamp(16px,3.6vw,48px) 40px;scroll-behavior:smooth}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.eb{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut)}
em{font-style:italic;color:var(--mut)}
.nav{position:sticky;top:12px;z-index:4;margin:12px auto 0;max-width:1500px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 12px 10px 22px;border-radius:99px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;letter-spacing:.04em}
.logo i{width:34px;height:34px;border-radius:50%;background:conic-gradient(#f4a98f,#e9a4c8,#a9a0ee,#8fd0e8,#bde8c8,#f4a98f);-webkit-mask:radial-gradient(circle,transparent 9px,#000 10px);mask:radial-gradient(circle,transparent 9px,#000 10px)}
.links{display:flex;gap:36px}.links button,.pill,.bar2 button,.back{font-size:12px;letter-spacing:.26em;text-transform:uppercase;font-weight:500}
.pill{background:var(--btn);color:var(--btnt);padding:16px 30px;border-radius:99px;transition:transform .15s}.pill:active{transform:scale(.97)}
.pill.big{padding:24px 54px;font-size:13px}
.hero{max-width:1500px;margin:0 auto;min-height:calc(100% - 80px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding-top:30px}
.badge{padding:10px 22px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut)}
.hero h1{font-size:clamp(54px,12.5vw,190px);line-height:.88;letter-spacing:.02em}
.hero h1 span{display:block}.yo{position:relative;display:inline-block!important;background:linear-gradient(90deg,#e8927c,#c9a3d9,#8fa8dc);-webkit-background-clip:text;background-clip:text;color:transparent}
.yo i{position:absolute;right:-.12em;top:.04em;width:.07em;height:.07em;border-radius:50%;background:#f28c3a}
.hero p{font-size:clamp(18px,2vw,26px);margin:0;color:var(--mut)}.hero p em{color:var(--ink)}
.prev{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.pc{width:min(23vw,300px);min-width:150px;padding:12px 12px 14px;border-radius:30px;background:var(--glass);border:1px solid var(--line);animation:fl 6s ease-in-out infinite alternate;text-align:left}
.pc:nth-child(even){margin-top:30px;animation-delay:-3s}@keyframes fl{to{transform:translateY(-14px)}}
.pc .st{height:120px}.pc div:last-child{display:flex;justify-content:space-between;margin-top:12px;padding:0 6px}
.st{display:flex;gap:5px;border-radius:22px;overflow:hidden}.st i{flex:1}
.sec{max-width:1500px;margin:90px auto 0}
.mirror{padding:clamp(28px,5vw,64px);border-radius:48px;background:var(--glass);border:1px solid var(--line);display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:34px;align-items:start}
.mirror h2{font-size:clamp(34px,4.6vw,64px);line-height:1}.mirror h3{font-size:25px;margin-bottom:10px}.mirror p{margin:0;color:var(--mut);line-height:1.6}
.mirror>div+div{border-left:1px solid var(--line);padding-left:24px}
.sec>h2{font-size:clamp(36px,5vw,70px);line-height:1;margin:14px 0 36px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.cc{display:block;text-align:left;padding:14px 14px 22px;border-radius:40px;background:var(--glass);border:1px solid var(--line);transition:transform .2s}.cc:hover{transform:translateY(-4px)}
.cc .st{height:clamp(200px,30vw,340px);border-radius:28px}
.cm{display:flex;justify-content:space-between;align-items:center;padding:20px 14px 0}.cm h3{font-size:30px;margin-bottom:6px}
.cta{max-width:1500px;margin:90px auto 0;border-radius:56px;padding:clamp(32px,6vw,80px);background:linear-gradient(120deg,#f8d5c2,#e3a9c7 55%,#b9a7ea);display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;color:#14193a}
.cta h2{font-size:clamp(38px,5.4vw,78px);line-height:1;max-width:11em;margin-top:18px}.cta .eb{color:#14193a99}.cta .pill{background:#14193a;color:#fff}
.qwrap{max-width:1500px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:clamp(18px,3vh,36px);padding-top:20px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(24px)}}
.top{display:flex;align-items:center;justify-content:space-between}
.back,.x{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:15px 26px}.x{width:54px;height:54px;padding:0;font-size:20px}
.top .t{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px}
.qline{display:flex;align-items:center;gap:20px;margin-top:2vh}.qline hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}
.qwrap h2{font-size:clamp(34px,5.4vw,78px);line-height:1.04;font-weight:400;max-width:17em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{display:flex;align-items:center;gap:22px;text-align:left;min-height:130px;padding:26px 30px;border-radius:38px;background:var(--glass);border:1px solid var(--line);font-size:clamp(18px,2vw,26px);transition:transform .15s,border-color .15s}
.opt:hover{transform:translateY(-3px)}.opt.sel{border-color:var(--ink);box-shadow:0 14px 40px -18px var(--ink)}
.opt b{flex:none;width:54px;height:54px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:400;font-size:15px;color:var(--mut)}
.opt.sel b{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.segs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding:8px 0 4px}
.segs i{width:clamp(30px,4.6vw,68px);height:9px;border-radius:5px;background:var(--line);position:relative}
.segs i.done,.segs i.cur{background:var(--ink)}.segs i[data-a]{cursor:pointer}.segs i[data-a]::after{content:"";position:absolute;inset:-12px 0}
.segs .eb{margin-left:14px;font-size:11px}
.rh{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;min-height:calc(100vh - 150px);padding-top:30px}
.rh h1{font-size:clamp(50px,8.4vw,128px);line-height:.92;font-weight:500;letter-spacing:.01em;margin:22px 0 22px;text-transform:uppercase}
.rh .sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(22px,2.4vw,32px);color:var(--mut);margin:0 0 20px}
.rh p.l{font-size:clamp(17px,1.7vw,22px);line-height:1.55;color:var(--mut);max-width:30em;margin:0 0 24px}
.chips{display:flex;gap:10px;flex-wrap:wrap}.chips span{padding:11px 20px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
.orb{justify-self:center;width:min(42vw,540px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-content:center;text-align:center;gap:10px;box-shadow:0 50px 120px -40px var(--c)}
.set{justify-self:center;width:min(46vw,620px);padding:14px 14px 22px;border-radius:44px;background:var(--glass);border:1px solid var(--line)}
.set .st{height:clamp(300px,52vh,540px);border-radius:32px;gap:6px}
.set .st button{flex:1;display:flex;align-items:flex-end;justify-content:center;padding:16px 0;font-size:12px;letter-spacing:.22em;writing-mode:vertical-rl;transform-origin:bottom}
.set .st button:first-child{flex:1.7}
.set .sl{padding:20px 12px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}.set h3{font-size:clamp(26px,3vw,40px)}
.rev .set .st button{animation:up .8s cubic-bezier(.2,.9,.3,1.1) both}.rev .set .st button:nth-child(2){animation-delay:.12s}.rev .set .st button:nth-child(3){animation-delay:.24s}.rev .set .st button:nth-child(4){animation-delay:.36s}.rev .set .st button:nth-child(5){animation-delay:.48s}
@media(max-width:900px){.set{width:100%}}
.orb .eb{color:inherit;opacity:.75;font-size:11px}.orb h3{font-size:clamp(34px,4.4vw,60px)}.orb small{letter-spacing:.3em;font-size:13px}
.scr{grid-column:2;justify-self:end;margin-top:-10px}
.rev .orb{animation:orb 1s cubic-bezier(.2,.9,.3,1.1) both}@keyframes orb{from{transform:scale(.55);opacity:0}}
.rev .fd{animation:fd .9s .5s both}@keyframes fd{from{opacity:0;transform:translateY(16px)}}
.story{display:grid;grid-template-columns:1fr 1fr;gap:34px;padding:clamp(26px,4vw,56px);border-radius:44px;background:var(--glass);border:1px solid var(--line)}
.story p{font-size:clamp(17px,1.7vw,21px);line-height:1.6;margin:0 0 12px}
.sws{display:flex;gap:8px}
.sw{flex:1;min-height:clamp(220px,34vh,360px);border-radius:28px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;font-size:12px;letter-spacing:.2em}
.sw b{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(19px,2vw,27px);font-weight:500;letter-spacing:0;margin-bottom:4px}
.rev .sw{animation:up .8s cubic-bezier(.2,.9,.3,1.1) both;transform-origin:bottom}@keyframes up{from{transform:scaleY(.2);opacity:0}}
.rev .sw:nth-child(2){animation-delay:.12s}.rev .sw:nth-child(3){animation-delay:.24s}.rev .sw:nth-child(4){animation-delay:.36s}.rev .sw:nth-child(5){animation-delay:.48s}
.sw em{font-style:normal;font-family:Jost,sans-serif;letter-spacing:0;font-size:14px;line-height:1.35;margin:0 0 16px;opacity:.88;color:inherit}
.mb{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(110px,15vh,170px);gap:10px}
.t{border-radius:28px;display:grid;place-items:center;padding:12px;text-align:center;overflow:hidden}.t b{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:500;font-style:italic}
.t.big{grid-column:span 2;grid-row:span 2}.t.big b{font-size:44px}.t.wide{grid-column:span 4}.dot{width:30%;aspect-ratio:1;border-radius:50%}
.bar2{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;display:flex;gap:4px;padding:8px 12px;border-radius:99px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);max-width:calc(100% - 24px);overflow-x:auto}
.bar2 button{padding:14px 18px;border-radius:99px;white-space:nowrap;font-size:11px}.bar2 button:hover{background:var(--line)}
.ov{position:fixed;inset:0;background:rgba(20,16,40,.45);display:grid;place-items:center;padding:20px;z-index:8}
.ov>div{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:36px;padding:28px;width:min(580px,100%);max-height:86%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.ov pre{white-space:pre-wrap;font:inherit;background:var(--glass);padding:16px;border-radius:20px;margin:0}
.srow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:24px;background:var(--glass)}.srow .st{flex:1;height:40px;border-radius:12px}.srow h3{font-size:20px}
.acts{display:flex;gap:10px;flex-wrap:wrap}.acts .g{padding:16px 24px;border-radius:99px;border:1px solid var(--line);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:12px 22px;border-radius:99px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}#toast.on{opacity:1}
@media(max-width:900px){.links{display:none}.mirror,.story,.grid,.rh,.opts{grid-template-columns:1fr}.mirror>div+div{border:0;padding:0}.orb{width:min(80vw,380px)}.scr{grid-column:1;justify-self:start}.sws{flex-wrap:wrap}.sw{min-width:44%;min-height:150px}.pc{width:42vw}.pc:nth-child(n+3){display:none}.rh{min-height:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.car{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:44px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.sl2{flex:0 0 100%;scroll-snap-align:center;min-height:clamp(360px,54vh,540px);padding:clamp(26px,5vw,64px);border-radius:44px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.sl2 .eb{color:inherit;opacity:.7}.sl2 h3{font-size:clamp(44px,7vw,100px);line-height:.95}.sl2 small{letter-spacing:.3em;font-size:14px}
.sl2 p{font-size:clamp(18px,2vw,26px);line-height:1.55;max-width:34em;margin:6px 0}.cp{align-self:flex-start;border:1px solid;border-radius:99px;padding:13px 24px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:500}
.dts{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px}.dts>button{font-size:22px;padding:8px 14px}
.dt{width:18px;height:18px;border-radius:50%;border:2px solid transparent;opacity:.55;transition:all .2s}.dt.on{opacity:1;transform:scale(1.35);border-color:var(--ink)}
.ideas{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.idea{padding:28px;border-radius:36px;background:var(--glass);border:1px solid var(--line)}.idea p{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(22px,2.2vw,30px);line-height:1.25;margin:14px 0 0}
.segs i{width:clamp(12px,2.2vw,36px)}
@media(max-width:900px){.ideas{grid-template-columns:1fr}}
</style></head>
<body><div id="app"></div><div id="ov"></div><div id="toast" role="status"></div>
<script>
const P=[
['The Sunset Dreamer','Sunset Orange F28C67,Peach FFC6A8,Rose E8A0B8,Lavender B9A7E8,Cream FFF0D8','You bring warmth and creativity wherever you go. You notice little details, love meaningful moments, and have a dreamy imagination.','Golden-hour film photos','Warm,Imaginative,Observant,Sentimental','The last warm hour of a coming-of-age movie','golden hour,soft focus,daydream'],
['The Midnight Muse','Midnight Indigo 2B2D6E,Plum 6B3FA0,Orchid B07CC6,Moon Silver C9D3EE,Ink 14122B','You think deeply and feel even more deeply. You are at your best when the world gets quiet and your ideas start to glow.','Moonlit poetry and starry skies','Introspective,Poetic,Mysterious,Intuitive','A night-sky observatory where someone writes songs','after dark,stargazing,quiet genius'],
['The Golden Optimist','Sunflower FFC83D,Honey F5A524,Butter FFE9A0,Coral FF8A65,Sky Blue 8FD3F4','You turn ordinary days into good ones. Your energy is contagious, and people feel lighter just by standing near you.','Sunny picnics and bright summer days','Cheerful,Generous,Energetic,Hopeful','The cheerful lead of a feel-good road trip movie','sunshine,good vibes,open windows'],
['The Ocean Soul','Deep Teal 1F7A8C,Sea Glass 8FD1C4,Wave BFDBF7,Sand EBDDBB,Navy 0F3057','You are calm on the surface and endlessly deep underneath. You go with the flow, but you always know where you are headed.','Coastal calm and sea glass','Calm,Loyal,Adaptable,Reflective','A lighthouse keeper who knows every tide','tide pools,salt air,slow waves'],
['The Creative Spark','Tangerine FF7A2F,Magenta E6358A,Electric Violet 7A4DFF,Lemon FFE14D,Aqua 3DD6D0','Ideas arrive for you faster than you can write them down. You make things, mix things, and turn every space into a studio.','Paint-splattered art studio','Inventive,Playful,Curious,Bold','The art-school kid with a sketchbook full of worlds','paint splatter,big ideas,collage'],
['The Soft Romantic','Blush F4B6C2,Rosewater FBD9DF,Mauve C79BB0,Ivory FFF6EE,Berry A8436A','You love gently and notice everything that makes a moment feel special. Handwritten notes and tiny rituals mean the world to you.','Pressed flowers and love letters','Tender,Thoughtful,Nostalgic,Caring','A rainy-day bookshop romance','love letters,rose petals,tea for two'],
['The Electric Rebel','Neon Pink FF2E88,Volt Lime C6FF3D,Cyber Blue 2D6BFF,Graphite 23232B,Hot Violet 9B30FF','You break the rules that never made sense. You are direct, magnetic, and never afraid to stand out.','Neon city nights','Fearless,Direct,Magnetic,Independent','The hacker who rides through a neon city at 2 a.m.','neon signs,loud music,no rules'],
['The Forest Thinker','Moss 5E7F4F,Pine 2F4F43,Fern 9DB88C,Bark 8A6A4F,Parchment EEE6D2','You are grounded, wise, and patient. You like understanding how things work and you find answers by slowing down.','Cabin shelves and mossy trails','Grounded,Analytical,Patient,Wise','A hidden library in an enchanted forest','mossy trails,old books,slow mornings'],
['The Cloud Daydreamer','Cloud Blue B7D6F5,Lilac D4C5F2,Mint C5EFDD,Cotton Pink F9D5E5,Mist F7F9FF','You live a little above the noise, in a gentle world of your own. You are kind, soft-spoken, and full of wonderful what-ifs.','Pastel skies and sleepy afternoons','Gentle,Dreamy,Easygoing,Kind','A floating island where it is always nap time','cotton clouds,pastel sky,sleepy sunday'],
['The Cherry Bomb','Cherry D9153F,Candy Red FF4D6D,Bubblegum FF9EBB,Cream Soda FFF1E6,Wine 6E0F2B','You are the main character and you know it. You are loud in the best way, bold with your style, and loyal to your people.','Retro diner glam','Confident,Dramatic,Loyal,Fun','The scene-stealing best friend in a 90s teen comedy','cherry red,center stage,sweet and sassy'],
['The Velvet Luxe','Burgundy 7A1F3D,Gold C9A24D,Champagne F3E3C3,Espresso 3B2A25,Blush Ivory FBEFE7','You have taste and you know it. You choose fewer things, but each one is rich, deliberate and unforgettable.','Old-world glamour and candlelit dinners','Polished,Magnetic,Discerning,Poised','The guest of honor at a midnight opera gala','velvet,candlelight,quiet luxury'],
['The Matcha Minimalist','Matcha 9DB17C,Oat E8DFCB,Stone B9B3A6,Cream F7F3EA,Charcoal 3A3F3C','You edit life down to what matters. Calm spaces, clear choices and a steady mind are your quiet luxuries.','Japanese-inspired calm and clean lines','Balanced,Intentional,Composed,Clear-headed','A sunlit tea room where nothing is out of place','matcha,clean lines,slow ritual'],
['The Lavender Hush','Lavender A89BD8,Lilac Mist D8CFF0,Periwinkle 7C86D1,Silver Rose D9B8C9,Twilight 3D3A66','You speak softly and notice everything. Your intuition runs deep, and your presence calms every room you enter.','Twilight spa mornings and dreamy stationery','Intuitive,Soothing,Gentle,Reflective','A quiet greenhouse at dusk','twilight,soft focus,hushed'],
['The Tropical Spirit','Papaya FF8A4C,Palm 1E9E6B,Lagoon 25C3C9,Hibiscus F2457D,Sunbeam FFD84A','You live with the windows down. Spontaneous and generous, you turn plain plans into holidays and bring everyone along.','Island markets, fruit stands and golden afternoons','Spontaneous,Sociable,Vibrant,Carefree','A beach-town road trip with the radio loud','papaya,palm shade,vacation mode'],
['The Desert Wanderer','Terracotta C8643C,Dune E2B988,Sage 9AAA85,Clay A8553F,Sand F2E4CF','You are free-spirited and rooted at once. Wide horizons, honest textures and slow adventures suit you best.','Boho desert dusk and handmade ceramics','Free-spirited,Earthy,Resilient,Sincere','A campfire under a huge desert sky','terracotta,open road,warm dust'],
['The Ice Queen','Glacier BFE3F2,Frost E9F5FB,Steel Blue 6E9BBF,Silver C7CFD8,Deep Slate 2E3A4F','You are cool, sharp and effortlessly composed. You keep your thoughts clear and your standards high.','Winter minimalism and glass architecture','Composed,Sharp,Independent,Elegant','A frozen lake at dawn, perfectly still','glacier,crisp air,clean edge'],
['The Candy Pop','Bubblegum FF8FC7,Mint Pop 9DF0D0,Lemon Drop FFF06B,Sky Pop 8EC8FF,Grape B57CFF','You bring giddy energy to everything. Silly, sweet and brave about fun, you make joy feel easy for everyone.','Arcade lights, sticker sheets and sleepover snacks','Playful,Sweet,Upbeat,Spontaneous','A pastel arcade at closing time with the lights still on','sugar rush,sticker sheets,giggles'],

const MU=[1.253, 3.477, 2.506, 2.51, 2.989, 2.995, 4.766, 1.761, 2.239, 4.23, 2.264, 2.989, 3.989, 3.249, 3.249, 3.248, 3.737, 2.006, 3.014, 3.764, 0.996, 4.012, 2.261, 2.744, 4.754],SD=[1.147, 2.206, 1.732, 1.739, 1.834, 1.943, 2.57, 1.44, 1.56, 2.327, 1.685, 2.042, 2.291, 1.981, 2.175, 1.88, 2.256, 1.625, 2.032, 2.24, 0.865, 2.132, 1.445, 1.793, 2.479];function rank(){const sc=Array(25).fill(0);s.a.forEach((a,i)=>{const o=Q[i][1][a];sc[o[1]]+=2;sc[o[2]]+=1});const z=sc.map((v,i)=>(v-MU[i])/SD[i]);const h=s.a.reduce((t,a,i)=>t+(a+1)*(i+3),0);return z.map((v,i)=>i).sort((x,y)=>z[y]-z[x]||((x*7+h)%25)-((y*7+h)%25))}
const cur=()=>s.pi!=null?s.pi:rank()[s.k%3];
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
async function copy(txt,msg){try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}toast(msg||'Copied')}
const palText=p=>`${P[p].n}\n`+P[p].c.map(x=>`${x[0]}: ${x[1].toUpperCase()}`).join('\n');
const nav=()=>`<nav class="nav"><button class="logo" data-a="home"><i></i>THE COLOR YOU</button><div class="links"><button data-a="home">Home</button><button data-a="col">Collection</button><button data-a="saved">My gallery${saved.length?' ('+saved.length+')':''}</button></div><button class="pill" data-a="start">Take the quiz</button></nav>`;
function home(){app.innerHTML=nav()+`<section class="hero"><span class="badge">✦ A personality color study</span>
<h1><span>THE COLOR</span><span class="yo">YOU<i></i></span></h1><p>Discover the colors that feel like <em>you.</em></p>
<button class="pill big" data-a="start">Discover my colors ↘</button>
<span class="eb">${Q.length} questions · about 3 minutes · nothing to sign up for</span>
<div class="prev">${[0,1,4,8].map(i=>`<button class="pc" data-a="view" data-v="${i}"><div class="st">${stripes(i)}</div><div class="eb"><span>${short(P[i].n)}</span><span>View</span></div></button>`).join('')}</div></section>
<section class="sec"><div class="mirror"><h2>Less like a test.<br><em>More like a mirror.</em></h2>
<div><h3>Answer honestly</h3><p>${Q.length} questions about how you move through rooms, mornings and ideas. There are no favorites and no right answers.</p></div>
<div><h3>Let the palette form</h3><p>Each answer shifts the balance of warmth, energy and depth. Your palette comes from the pattern, never from chance.</p></div>
<div><h3>Keep what’s yours</h3><p>Save it to your gallery, copy the hex codes, download it as an image, or send it to someone who knows you.</p></div></div></section>
<section class="sec" id="col"><span class="eb">The collection</span><h2>Twenty-five personalities.<br><em>One of them is yours.</em></h2>
<div class="grid">${P.map((p,i)=>`<button class="cc" data-a="view" data-v="${i}"><div class="st">${stripes(i)}</div><div class="cm"><div><h3>${short(p.n)}</h3><span class="eb">${T[i]}</span></div><span>→</span></div></button>`).join('')}</div></section>
<section class="cta"><div><span class="eb">Ready when you are</span><h2>Your colors have been waiting for you.</h2></div><button class="pill big" data-a="start">Discover my colors ↘</button></section>`}
function quiz(){const q=Q[s.q];
app.innerHTML=`<div class="qwrap"><div class="top"><button class="back" data-a="back">← Back</button><span class="t">THE COLOR YOU</span><button class="back" data-a="home">⌂ Home</button></div>
<div class="qline"><span class="eb">${pad(s.q+1)} / ${Q.length}</span><hr><span class="eb">Choose one</span></div><h2>${q[0]}</h2>
<div class="opts">${q[1].map((o,i)=>`<button class="opt${s.a[s.q]===i?' sel':''}" data-a="pick" data-v="${i}"><b>${'ABCD'[i]}</b>${o[0]}</button>`).join('')}</div>
<div class="segs">${Q.map((_,i)=>`<i class="${i<s.q?'done':''}${i==s.q?' cur':''}" ${i<=s.a.length?`data-a="jump" data-v="${i}" title="Question ${i+1}"`:''}></i>`).join('')}<span class="eb">Tap a bar to revisit an answer</span></div></div>`}
function mood(p){const c=p.c.map(x=>x[1]),w=p.w;return`<div class="mb">
<div class="t big" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><b style="color:${lum(c[0])}">${w[0]}</b></div>
<div class="t" style="background:${c[2]}"><span class="dot" style="background:${c[3]}"></span></div>
<div class="t" style="background:repeating-linear-gradient(90deg,${c[1]} 0 14px,${c[4]} 14px 28px)"></div>
<div class="t" style="background:${c[3]}"><b style="color:${lum(c[3])}">${w[1]}</b></div>
<div class="t" style="background:conic-gradient(from 90deg,${c[0]},${c[2]},${c[4]},${c[0]})"></div>
<div class="t wide" style="background:${c[4]}"><b style="color:${lum(c[4])}">${p.a} · ${w[2]}</b></div></div>`}
function result(){const pi=cur(),p=P[pi],m=p.c[0];
const pick=s.a.map((a,i)=>Q[i][1][a]).filter(o=>o[1]==pi||o[2]==pi).slice(0,2).map(o=>`“${o[0].replace(/[.…]+$/,'')}”`);
const why=s.pi!=null?`A look at one of the ten personalities. Its mood: ${p.w.join(', ')}.`:pick.length?`Your answers pointed here: you chose ${pick.join(' and ')}. Those picks share this palette’s ${p.w[0]} and ${p.w[1]} mood.`:`Your answers added up to this palette’s ${p.w[0]} and ${p.w[1]} mood.`;
const isSaved=saved.some(x=>x.pi==pi);
app.innerHTML=nav()+`<div class="${s.anim?'rev':''}"><section class="rh"><div><span class="badge">${s.pi!=null?'The collection':'Your palette'}</span><h1>${short(p.n)}</h1>
<p class="sub fd">${p.n} · ${T[pi]}</p><p class="l fd">${why}</p><div class="chips fd">${p.t.map(t=>`<span>${t}</span>`).join('')}</div></div>
<div class="set"><div class="st">${p.c.map((x,i)=>`<button data-a="jumpc" data-v="${i}" style="background:${x[1]};color:${lum(x[1])}" aria-label="See ${x[0]} ${x[1]}">${x[1].toUpperCase()}</button>`).join('')}</div><div class="sl"><span class="eb">Your color set</span><h3>${m[0]} leads</h3><span class="eb">Main color ${m[1].toUpperCase()}</span></div></div>
<span class="eb scr">Scroll for your color story</span></section>
<section class="sec" style="margin-top:50px"><span class="eb">Your color story</span><h2 style="margin-bottom:26px">${p.v}.</h2><div class="story"><div><p>${p.d}</p></div><div><p>Your aesthetic is ${p.a.toLowerCase()}, and the words that fit you best are ${p.w.join(', ')}.</p><p><em>People tend to feel you as ${T[pi]}.</em></p></div></div></section>
<section class="sec" style="margin-top:60px"><span class="eb">Your personality colors</span><h2 style="margin-bottom:26px">Swipe through your five colors.</h2>
<div class="car" id="car" onscroll="dots(this)">${p.c.map((x,i)=>`<div class="sl2" style="background:${x[1]};color:${lum(x[1])}"><span class="eb">${i+1} / 5</span><h3>${x[0]}</h3><small>${x[1].toUpperCase()}</small><p>${CD[pi][i]}</p><button class="cp" data-a="copy" data-v="${x[1]}" style="border-color:${lum(x[1])}">Copy hex</button></div>`).join('')}</div>
<div class="dts"><button data-a="prev" aria-label="Previous color">←</button>${p.c.map((x,i)=>`<button class="dt${i?'':' on'}" data-a="goto" data-v="${i}" style="background:${x[1]}" aria-label="${x[0]}"></button>`).join('')}<button data-a="next" aria-label="Next color">→</button></div></section>
<section class="sec" style="margin-top:60px"><span class="eb">Wear it, live in it</span><h2 style="margin-bottom:26px">Where to use your palette.</h2>
<div class="ideas">${['Wear','Home','Little things'].map((l,i)=>`<div class="idea"><span class="eb">${l}</span><p>${U[pi][i]}.</p></div>`).join('')}</div></section>
<section class="sec" style="margin:60px auto 110px"><span class="eb">Your aesthetic</span><h2 style="margin-bottom:26px">${p.a}.</h2>${mood(p)}</section></div>
<div class="bar2"><button data-a="home">⌂ Home</button><button data-a="copyall">⧉ Copy all</button><button id="sv" data-a="save">${isSaved?'♥ Saved':'♡ Save'}</button>${s.pi!=null?'<button data-a="start">✧ Take the quiz</button>':'<button data-a="another">✧ Another</button>'}<button data-a="dl">↓ Download</button><button data-a="share">⤴ Share</button><button data-a="retake">↻ Retake</button></div>`;s.anim=false;app.scrollTop=0}
function draw(){if(s.v==='home')home();else if(s.v==='quiz')quiz();else result()}
function modal(h){$('#ov').innerHTML=h?`<div class="ov" data-a="close"><div role="dialog" onclick="event.stopPropagation()">${h}</div></div>`:''}
function dots(el){const i=Math.round(el.scrollLeft/(el.clientWidth+16));document.querySelectorAll('.dt').forEach((d,j)=>d.classList.toggle('on',j==i))}
const acts={
goto(v){const c=$('#car');c.scrollTo({left:v*(c.clientWidth+16),behavior:'smooth'})},
prev(){const c=$('#car');c.scrollBy({left:-(c.clientWidth+16),behavior:'smooth'})},
next(){const c=$('#car');c.scrollBy({left:c.clientWidth+16,behavior:'smooth'})},
jumpc(v){const c=$('#car');c.scrollTo({left:v*(c.clientWidth+16)});c.scrollIntoView({behavior:'smooth',block:'center'});dots(c)},
start(){modal('');s={v:'quiz',q:0,a:[],k:0,pi:null,anim:false};draw();app.scrollTop=0},
home(){s.v='home';draw();app.scrollTop=0},
col(){if(s.v!=='home'){s.v='home';draw()}setTimeout(()=>{const e=$('#col');if(e)e.scrollIntoView({behavior:'smooth'})},40)},
back(){if(s.q>0){s.q--;draw()}else{s.v='home';draw()}},
jump(v){s.q=+v;draw()},
pick(v,el){s.a[s.q]=+v;el.classList.add('sel');setTimeout(()=>{if(s.q<Q.length-1){s.q++}else{s.v='result';s.k=0;s.pi=null;s.anim=true}draw()},260)},
copy(v){copy(v.toUpperCase(),'Copied '+v.toUpperCase())},
copyall(){copy(palText(cur()),'Palette copied')},
save(){const pi=cur();if(!saved.some(x=>x.pi==pi)){saved.push({pi,t:Date.now()});store.set(saved);toast('Saved to your gallery')}else toast('Already saved');$('#sv').textContent='♥ Saved'},
another(){s.k++;s.anim=true;draw();toast(s.k%3?'Another reading from your answers':'Back to your best match')},
retake(){acts.start()},
saved(){modal(`<h2>My gallery</h2>${saved.length?saved.map(x=>`<div class="srow"><div class="st">${stripes(x.pi)}</div><h3>${short(P[x.pi].n)}</h3><button class="acts g" style="padding:10px 16px;border:1px solid var(--line);border-radius:99px;font-size:11px;letter-spacing:.2em;text-transform:uppercase" data-a="view" data-v="${x.pi}">View</button><button data-a="del" data-v="${x.pi}" aria-label="Remove ${P[x.pi].n}" style="padding:8px 12px">✕</button></div>`).join(''):'<p>Nothing saved yet. Finish the quiz and press Save.</p>'}<div class="acts"><button class="pill" data-a="close">Close</button></div>`)},
view(v){s.pi=+v;s.v='result';s.anim=true;modal('');draw()},
del(v){saved=saved.filter(x=>x.pi!=v);store.set(saved);acts.saved();if(s.v==='home')draw()},
close(){modal('')},
share(){const t=`My color personality is ${P[cur()].n}.\n`+P[cur()].c.map(x=>`${x[0]} ${x[1].toUpperCase()}`).join(' · ')+'\nFind your colors with THE COLOR YOU.';
modal(`<h2>Share my results</h2><pre id="st">${t}</pre><div class="acts"><button class="pill" data-a="copytext">Copy text</button>${navigator.share?'<button class="pill" data-a="native">Share…</button>':''}<button class="g acts" style="padding:16px 24px;border:1px solid var(--line);border-radius:99px;font-size:12px;letter-spacing:.2em;text-transform:uppercase" data-a="close">Close</button></div>`)},
copytext(){copy($('#st').textContent,'Results copied')},
native(){navigator.share({title:'THE COLOR YOU',text:$('#st').textContent}).catch(()=>{})},
async dl(){const p=P[cur()],c=document.createElement('canvas');c.width=1200;c.height=800;const x=c.getContext('2d');
const g=x.createLinearGradient(0,0,1200,800);g.addColorStop(0,'#f8d5c2');g.addColorStop(.55,'#ecc4d6');g.addColorStop(1,'#d9d0f0');x.fillStyle=g;x.fillRect(0,0,1200,800);
x.fillStyle='#14193a';x.font='500 76px "Cormorant Garamond",Georgia,serif';x.fillText(short(p.n).toUpperCase(),60,120);x.font='22px Jost,sans-serif';x.fillText('THE COLOR YOU  ·  '+T[P.indexOf(p)].toUpperCase(),60,166);
p.c.forEach((k,i)=>{const px=60+i*226;x.fillStyle=k[1];x.beginPath();x.roundRect(px,210,206,500,28);x.fill();x.fillStyle=lum(k[1]);x.font='500 26px "Cormorant Garamond",Georgia,serif';x.fillText(k[0],px+16,650,176);x.font='20px Jost,sans-serif';x.fillText(k[1].toUpperCase(),px+16,686)});
const blob=await new Promise(r=>c.toBlob(r,'image/png'));let d=null;try{d=await claude.use('downloads')}catch(e){}
if(!d)return toast('Downloads are not available in this view');
try{await d.save({filename:'my-color-you.png',data:blob})}catch(e){if(e&&e.code!=='declined')toast('Could not save the image')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=acts[t.dataset.a];if(f)f(t.dataset.v,t)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal('')});
draw();
</script></body></html>
